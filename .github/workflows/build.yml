name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android papkasini yaratish
        run: flutter create --platforms=android --project-name kali_oquv --org uz.kali .
      - name: Shpargalka vidjetini qo'shish
        run: |
          mkdir -p android/app/src/main/kotlin/uz/kali/kali_oquv
          cp native/ShpargalkaWidget.kt android/app/src/main/kotlin/uz/kali/kali_oquv/
          cp -r native/res/. android/app/src/main/res/
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          r = open('native/receiver.xml', encoding='utf-8').read()
          s = s.replace('</application>', r + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Ilova nomi
        run: sed -i 's/android:label="[^"]*"/android:label="Kali Oquv"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kali-oquv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
