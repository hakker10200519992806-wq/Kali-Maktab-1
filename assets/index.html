<title>Kali O'quv</title>

<style>
*{box-sizing:border-box}
:root{--bg:#f4f7fa;--card:#fff;--cd:#f1f5f9;--fg:#1b2433;--mut:#5a6b80;--bd:#d3dce8;--ac:#14788c;--ok:#16803c;--no:#c0392b;--wr:#8a5a00;--gr:#1fa84f;--hd:#14788c;--cb:#121a33;--ic:#c2255c;--zb:#f3f6fb;--tipb:#eaf7ef;--warnb:#fdeeee;--wt:#b02a2a;--bad:var(--no);--pn:var(--card);--tx:var(--fg);--ln:var(--bd);--hf:"Bricolage Grotesque",system-ui,sans-serif;--mf:"JetBrains Mono",ui-monospace,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1320;--card:#141c2d;--cd:#1b2539;--fg:#dbe4f4;--mut:#8d9db9;--bd:#26324b;--ac:#5b9bff;--ok:#3ec28f;--no:#ff7a6b;--wr:#f2b84b;--gr:#3ec28f;--hd:#5bc0d8;--cb:#0a0f1a;--ic:#ff8ab5;--zb:#18223a;--tipb:#12261f;--warnb:#2a1616;--wt:#ff8a8a}}
:root[data-theme=dark]{--bg:#0d1320;--card:#141c2d;--cd:#1b2539;--fg:#dbe4f4;--mut:#8d9db9;--bd:#26324b;--ac:#5b9bff;--ok:#3ec28f;--no:#ff7a6b;--wr:#f2b84b;--gr:#3ec28f;--hd:#5bc0d8;--cb:#0a0f1a;--ic:#ff8ab5;--zb:#18223a;--tipb:#12261f;--warnb:#2a1616;--wt:#ff8a8a}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-size:var(--fs,16px);line-height:1.5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--hf);margin:.2em 0}h2,h3{color:var(--hd)}
#hd{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);align-items:center;font-size:14px}
#hd h1{font-size:18px;font-weight:800;white-space:nowrap;margin:0;color:var(--hd)}
.bar{flex-basis:100%;height:8px;background:var(--cd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr);transition:width .3s}
main{max-width:720px;margin:0 auto;padding:14px}.mono{font-family:var(--mf);font-weight:600}
.mu{color:var(--mut);font-size:13px}
input[type=text],textarea{width:100%;padding:9px 11px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:var(--fs,16px);font-family:inherit}
textarea{font:13px var(--mf)}
details,.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:10px 0}.card{padding:14px}
summary{padding:13px 14px;cursor:pointer;font-weight:600;font-family:var(--hf)}.item{padding:10px 14px;border-top:1px solid var(--bd);cursor:pointer}.item:hover{background:var(--cd)}.item small{display:block;color:var(--mut)}
.item .mono{color:var(--ac)}
button{font:inherit;font-size:13.5px;padding:8px 12px;margin:2px;border-radius:6px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}button.p:hover:not(:disabled){color:#fff;opacity:.9}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.opt{display:block;width:100%;margin:8px 0;text-align:left;padding:12px;background:var(--card);font-size:inherit}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--fg)}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card));color:var(--fg)}
pre{background:var(--cb);border-left:4px solid var(--gr);color:#e6edf7;padding:12px;border-radius:4px;overflow-x:auto;margin:8px 0;white-space:pre-wrap;font:13px/1.45 var(--mf)}
.term{display:flex;gap:8px;background:#0a0f1a;border-radius:8px;padding:10px 12px;color:#5b9bff;font:13px var(--mf);align-items:center}
.term input{flex:1;min-width:0;background:transparent;border:0;color:#cfe3ff;font:var(--fs,15px) var(--mf);outline:none}
#tlog{background:#0a0f1a;color:#cfe3ff;border-radius:8px 8px 0 0;padding:10px;height:260px;overflow:auto;font:calc(var(--fs,16px) - 3px)/1.45 var(--mf);white-space:pre-wrap;word-break:break-word}
#tlog+.term{border-radius:0 0 8px 8px;border-top:1px solid #1d2a44}
.pr{color:#5b9bff}.o{color:#8da2c6}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;border:0;border-radius:0;margin:0;background:none;color:var(--mut);font:600 11.5px system-ui;padding:8px 0 7px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--ac)}
.right{text-align:right;color:var(--mut)}
.chip{padding:6px 11px;font-size:13px;border-radius:16px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;font-size:13px;z-index:90;pointer-events:none}
code{color:var(--ic);font:.92em var(--mf);background:color-mix(in srgb,var(--ic) 7%,transparent);padding:1px 5px;border-radius:4px}
.bk{padding:16px 18px}
.bk h2{font:800 26px/1.25 "DejaVu Sans",Verdana,var(--hf);color:var(--fg);margin:.2em 0 .7em;padding-bottom:8px;border-bottom:4px solid var(--gr)}
.bk h3{font:700 20px/1.3 "DejaVu Sans",Verdana,var(--hf);color:var(--hd);margin:1.4em 0 .5em}
.bk h4{font:700 16px "DejaVu Sans",Verdana,var(--hf);color:var(--fg);margin:1.3em 0 .4em}
.bk p,.bk li{line-height:1.6}.bk ul,.bk ol{padding-left:22px}
.bk pre{position:relative;margin:12px 0;white-space:pre;overflow-x:auto;font-size:13px;line-height:1.5}
.bk pre code{background:none;color:inherit;padding:0;font:inherit}
.cmt{color:#a9b6cc}
.cpy{position:absolute;top:6px;right:6px;margin:0;padding:3px 8px;font-size:11px;background:#1f2a48;color:#cfe3ff;border-color:#2e3b5e}
.tw{overflow-x:auto;margin:12px 0}.bk table{border-collapse:collapse;width:100%;font-size:14px}
.bk th{background:var(--cb);color:#fff;text-align:left;padding:8px 10px;border:1px solid var(--cb)}
.bk td{padding:7px 10px;border:1px solid var(--bd);vertical-align:top}.bk tr:nth-child(even) td{background:var(--zb)}
.bk .tip,.bk .warn{margin:14px 0;padding:10px 14px;border-left:4px solid var(--gr);background:var(--tipb);border-radius:0 6px 6px 0}
.bk .warn{border-color:#d63a3a;background:var(--warnb)}.bk .tip b,.bk .warn b{display:block;margin-bottom:2px}.bk .warn b{color:var(--wt)}
.bk .ex li{margin:6px 0}.bk .ex label{cursor:pointer}.bk .ex input{margin-right:6px}.bk .ex label.done{opacity:.6}
.item .mono,.card .mono{color:var(--ac)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- Robot ---- */
#rb{position:fixed;left:0;top:0;width:96px;z-index:60;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform}
#rb[hidden]{display:none}#rb.g{cursor:grabbing}
#rb .rbf{animation:rbob 3.2s ease-in-out infinite}
#rb.g .rbf{animation:none;transform:rotate(-5deg) scale(1.07)}
@keyframes rbob{50%{transform:translateY(-7px) rotate(1.5deg) scale(1.015)}}
#rb svg{overflow:visible;display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));transition:transform .25s}
#rbE{filter:drop-shadow(0 0 2.5px #7df3ff);transition:transform .12s}
.e,.sp,.pu{transform-box:fill-box;transform-origin:center}
.e[data-e=idle],.e[data-e=flat]{animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.sp{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pu{animation:pulse .8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.18)}}
.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.tr{animation:tear 1.6s ease-in infinite}@keyframes tear{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.rbb{position:absolute;width:max-content;max-width:min(230px,64vw);padding:8px 12px;border-radius:14px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);font-size:13px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(4px) scale(.96);transition:opacity .2s,transform .2s;pointer-events:none}
.rbb.s{opacity:1;transform:none}.rbb.up{bottom:100%;margin-bottom:4px}.rbb.dn{top:100%;margin-top:4px}.rbb.l{left:0}.rbb.r{right:0}
.arm{transition:transform .4s cubic-bezier(.34,1.5,.64,1)}
@keyframes sg{from{transform:rotate(calc(var(--s)*var(--amp)*-1deg))}to{transform:rotate(calc(var(--s)*var(--amp)*1deg))}}
.rbhl{outline:3px solid #7df3ff!important;outline-offset:3px;border-radius:8px;animation:hl .7s ease-in-out infinite alternate}@keyframes hl{to{outline-color:transparent}}
.rpr{transition:transform .4s cubic-bezier(.34,1.5,.64,1)}
#rbH{transform-origin:60px 84px}
.an{transform-box:fill-box;transition:transform .45s cubic-bezier(.34,1.5,.64,1)}.anl{transform-origin:70% 90%}.anr{transform-origin:30% 90%}
#rb:is([data-m=sad],[data-m=tired],[data-m=sick]) .anl{transform:rotate(-38deg) scaleY(.75)}
#rb:is([data-m=sad],[data-m=tired],[data-m=sick]) .anr{transform:rotate(38deg) scaleY(.75)}
#rb[data-m=think] .anr,#rb[data-m=sus] .anr{transform:rotate(30deg)}
#rb:is([data-m=happy],[data-m=proud],[data-m=star],[data-m=love],[data-m=money]) .an{animation:anw .5s ease-in-out infinite alternate}
@keyframes anw{to{transform:rotate(8deg)}}
.em{transition:filter .2s}#rb.ty .em{filter:drop-shadow(0 0 5px #7df3ff);stroke:#7df3ff}
#rb.nod #rbH{animation:nod .45s ease-in-out 3}@keyframes nod{50%{transform:translateY(7px)}}
#rb.shk #rbH{animation:shk .3s ease-in-out 4}@keyframes shk{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#rb.fl .rbf{animation:fl .95s ease-in-out;transform-origin:50% 60%}@keyframes fl{0%{transform:none}50%{transform:translateY(-52px) rotate(180deg)}100%{transform:rotate(360deg)}}
#rb.bw .rbf{animation:bw 1.6s ease-in-out;transform-origin:50% 100%}@keyframes bw{35%,65%{transform:rotate(20deg) translateY(6px)}}
#rb.dc .rbf{animation:dc .5s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes dc{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-12px)}}
.rbd{position:absolute;width:max-content;max-width:min(280px,76vw);padding:8px 10px;border-radius:12px;background:#10261c;color:#e8fff0;border:3px solid #8a5a2b;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;flex-wrap:wrap;gap:6px}
.rbd.s{opacity:1}.rbd.up{bottom:100%;margin-bottom:4px}.rbd.dn{top:100%;margin-top:4px}.rbd.l{left:0}.rbd.r{right:0}
.rbd .mu{width:100%;color:#a9d6bb;font-size:12px}
.tk{display:flex;flex-direction:column;align-items:center;opacity:0;animation:tkin .4s forwards}
.tk code{background:#0a1a12;color:inherit;border:1px solid currentColor;padding:2px 7px;border-radius:4px;font:13px var(--mf)}.tk i{font-size:10px;font-style:normal}
.tk.b{color:#7df3ff}.tk.o{color:#ffc65a}.tk.g{color:#7dff9d}.tk.p{color:#ff8ad8}
@keyframes tkin{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:none}}
@media(max-width:860px){#rb{width:70px}}
@media(prefers-reduced-motion:reduce){#rb .rbf,.e,.sp,.pu,.zz,.tr,.rbhl,#rb #rbH,.an,.tk{animation:none!important}.arm{transition:none!important}}

let lm='book',bkOpen=null;
const ic=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const codeHtml=s=>s.split('\n').map(l=>{const m=l.match(/^(\$ .*?\S)(\s{2,}#.*)$/);return m?esc(m[1])+'<span class="cmt">'+esc(m[2])+'</span>':esc(l)}).join('\n');
const bkTotal=c=>BOOK[c].b.reduce((n,b)=>n+(b[0]==='ex'?b[2].length:0),0),bkDone=c=>Object.keys(S.bk).filter(k=>k.startsWith(c+'-')&&!k.endsWith('!')).length;
function bkBlock(b,ci,bi){const t=b[0];
 if(t==='h3')return `<h3>${ic(b[1])}</h3>`;
 if(t==='p')return `<p>${ic(b[1])}</p>`;
 if(t==='ul')return `<ul>${b[1].map(x=>`<li>${ic(x)}</li>`).join('')}</ul>`;
 if(t==='code')return `<pre>${b[1].includes('$ ')?`<button class="cpy" onclick="bkCopy(${ci},${bi})">Nusxa</button>`:''}${codeHtml(b[1])}</pre>`;
 if(t==='tbl')return `<div class="tw"><table><tr>${b[1].map(h=>`<th>${ic(h)}</th>`).join('')}</tr>${b[2].map(r=>`<tr>${r.map(c=>`<td>${ic(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(t==='tip'||t==='warn')return `<div class="${t}"><b>${ic(b[1])}</b>${ic(b[2])}</div>`;
 if(t==='ex')return `<h4>${ic(b[1])}</h4><ol class="ex">${b[2].map((x,i)=>{const k=ci+'-'+bi+'-'+i;return `<li><label class="${S.bk[k]?'done':''}"><input type="checkbox" ${S.bk[k]?'checked':''} onchange="bkTick('${k}',this.checked)"> ${ic(x)}</label></li>`}).join('')}</ol>`;
 return ''}
function bookView(){if(bkOpen===null)return `<p class="mu">Kitob boblari. Mashqlarni terminalda (Terminal bo'limi) bajarib belgilang: har biri +5 XP.</p>`+BOOK.map((c,i)=>`<div class="card"><b style="font-size:17px">${esc(c.t)}</b><p class="mu">Mashqlar: ${bkDone(i)}/${bkTotal(i)}</p><button class="p" onclick="bkOpenCh(${i})">O'qish</button></div>`).join('');
 const c=BOOK[bkOpen];return `<button onclick="bkOpen=null;render()">← Boblar</button><div class="bk card"><h2>${esc(c.t)}</h2>${c.b.map((b,bi)=>bkBlock(b,bkOpen,bi)).join('')}</div>`+(bkOpen<BOOK.length-1?`<button class="p" onclick="bkOpenCh(${bkOpen+1})">Keyingi bob →</button>`:'')}
function bkOpenCh(i){bkOpen=i;render();scrollTo(0,0)}
function bkTick(k,on){if(on){S.bk[k]=1;if(!S.bk[k+'!']){S.bk[k+'!']=1;addXP(5);act()}}else delete S.bk[k];save();head();render()}
function bkCopy(ci,bi){copy(BOOK[ci].b[bi][1].split('\n').filter(l=>l.startsWith('$ ')).map(l=>l.slice(2).replace(/\s{2,}#.*$/,'')).join('\n'))}
function lessons(){return `<p><button class="chip ${lm==='book'?'on':''}" onclick="lm='book';render()">📖 Kitob</button><button class="chip ${lm==='cmd'?'on':''}" onclick="lm='cmd';render()">⌨️ Buyruqlar</button></p>`+(lm==='book'?bookView():lessonsCmd())}

/* ---------- Opsiya darsi ---------- */
let O={cmd:null,i:0};
function openOpt(c){tab=1;O={cmd:c==='tail'?'head':c,i:0};render();scrollTo(0,0)}
function optView(){
 if(!O.cmd)return `<div class="card"><b>Buyruq tuzilishi</b><pre>$ ls -l /etc</pre><span class="mono">ls</span> buyruq (nima qilish)<br><span class="mono">-l</span> opsiya/flag (qanday qilish)<br><span class="mono">/etc</span> argument (nimaga qilish)<ul><li>Qisqa opsiya: <span class="mono">-l</span>, uzun: <span class="mono">--all</span></li><li>Qisqalarni birlashtirish mumkin: <span class="mono">-l -a</span> = <span class="mono">-la</span></li><li>Ba'zi opsiyalar qiymat oladi: <span class="mono">-n 3</span></li><li>Yordam: <span class="mono">--help</span> yoki <span class="mono">man buyruq</span></li></ul></div><p>Buyruqni tanlang, har bir opsiyani bittalab ko'rasiz:</p>${OK.map(k=>`<button class="${S.opt[k]?'p':''}" onclick="O={cmd:'${k}',i:0};render()">${k==='head'?'head/tail':k}${S.opt[k]?' ✓':''}</button>`).join('')}`;
 const L=OPT[O.cmd],s=L[O.i],end=O.i===L.length-1;
 return `<div class="right">${O.cmd==='head'?'head/tail':O.cmd} · ${O.i+1}/${L.length}</div><div class="card"><pre>$ ${esc(s[0])}</pre><p>${esc(s[1])}</p>${s[2]?`<pre style="color:var(--mut)">${esc(s[2])}</pre>`:''}</div><button ${O.i?'':'disabled'} onclick="O.i--;render()">Oldingi</button><button class="p" onclick="optNext(${end})">${end?'Tugatish (+15 XP)':'Keyingi'}</button><button onclick="O.cmd=null;render()">Ro'yxat</button>`}
function optNext(end){if(!end){O.i++;render();return}if(!S.opt[O.cmd]){S.opt[O.cmd]=1;addXP(15);act();save();head();toast('Dars tugadi! +15 XP')}O.cmd=null;render()}

/* ---------- Test ---------- */
let T={mode:'opt',q:null,opts:[],picked:null,msg:'',done:false,left:60,score:0,timer:null,over:false};
const stopT=()=>{clearInterval(T.timer);T.timer=null};
function newQ(){T.q=rnd(ALL);const o=new Set([T.q]);while(o.size<4)o.add(rnd(ALL));T.opts=[...o].sort(()=>Math.random()-.5);T.picked=null;T.msg='';T.done=false}
function setMode(m){stopT();T.mode=m;T.over=false;newQ();if(m==='time'){T.left=60;T.score=0;T.timer=setInterval(tick,1000)}render()}
function tick(){T.left--;const e=$('#tm');if(e)e.textContent=T.left;if(T.left<=0){stopT();T.over=true;if(T.score>S.best){S.best=T.score;save();toast('Yangi rekord!')}render()}}
function testView(){
 const m=(k,x)=>`<button class="${T.mode===k?'p':''}" onclick="setMode('${k}')">${x}</button>`;let h=`<p>${m('opt','Variantli')}${m('type','Yozma')}${m('time','60 soniya')}</p>`;
 if(T.over)return h+`<div class="card"><b>Vaqt tugadi!</b><p>${T.score} ta to'g'ri. Rekord: ${S.best}</p></div><button class="p" onclick="setMode('time')">Qayta boshlash</button>`;
 if(T.mode==='time')h+=`<div class="right">⏱ <span id="tm">${T.left}</span> s · Ball: ${T.score}</div>`;
 h+=`<div class="card">${T.mode==='type'?'Buyruqni yozing: ':'Qaysi buyruq: '}${esc(T.q[1])}</div>`;
 if(T.mode==='type')return h+`<div class="term"><span>$</span><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')chkT()"></div><p><button class="p" onclick="chkT()">Tekshirish</button><button onclick="T.msg='Maslahat: '+T.q[0];render()">Maslahat</button><button onclick="newQ();render()">Keyingi</button></p><div>${esc(T.msg)}</div>`;
 h+=T.opts.map((o,i)=>`<button class="opt mono ${T.picked?(o===T.q?'ok':o===T.picked?'bad':''):''}" ${T.picked?'disabled':''} onclick="pick(${i})">${esc(o[0])}</button>`).join('');
 return h+(T.picked&&T.mode==='opt'?'<button class="p opt" onclick="newQ();render()">Keyingi savol</button>':'')}
function pick(i){if(T.picked)return;T.picked=T.opts[i];const ok=T.picked===T.q;answer(T.q,ok);
 if(T.mode==='time'){if(ok)T.score++;render();setTimeout(()=>{if(T.mode==='time'&&!T.over&&tab===2){newQ();render()}},450)}else render()}
function chkT(){if(T.done){return}const ok=$('#ti').value.trim().split(' ')[0]===T.q[0].split(' ')[0];T.done=true;answer(T.q,ok);T.msg=ok?"To'g'ri! Namuna: "+T.q[2]:"Noto'g'ri. Javob: "+T.q[2];render()}

let K={q:null,show:false};
function cardsView(){const c=[0,0,0];ALL.forEach(x=>{const b=S.box[x[0]];if(b===undefined)c[0]++;else if(b>=4)c[2]++;else c[1]++});
 let h=`<div class="right">Yangi: ${c[0]} · O'rganilmoqda: ${c[1]} · O'zlashtirilgan: ${c[2]}</div>`;
 if(!K.q){const d=ALL.filter(x=>(S.due[x[0]]||0)<=Date.now()).sort((a,b)=>(S.box[a[0]]||0)-(S.box[b[0]]||0));if(d.length){K.q=d[0];K.show=false}}
 if(!K.q)return h+`<div class="card">Hozircha takrorlash kerak emas. Keyinroq qaytib keling!</div><button onclick="K.q=rnd(ALL);K.show=false;render()">Baribir mashq qilish</button>`;
 h+=`<div class="card">${esc(K.q[1])}</div>`;
 if(!K.show)return h+`<button class="p opt" onclick="K.show=true;render()">Javobni ko'rsat</button>`;
 return h+`<pre>$ ${esc(K.q[2])}</pre><button class="opt" onclick="rate(1)">Bildim</button><button class="opt" onclick="rate(0)">Bilmadim</button>`}

${robotCard()}<div class="card"><b>Ko'rinish</b><p>Rejim: ${['auto','dark','light'].map((m,i)=>`<button class="chip ${S.set.theme===m?'on':''}" onclick="setTh('${m}')">${['Avto',"Qorong'i","Yorug'"][i]}</button>`).join('')}</p><p>Shrift: <button onclick="setFs(-2)">A−</button> ${S.set.font}px <button onclick="setFs(2)">A+</button></p></div>
<div class="card"><b>Zaxira (JSON)</b><p>Telefonni almashtirsangiz, progress va o'z buyruqlaringiz yo'qolmasligi uchun.</p><textarea id="io" rows="4" placeholder="Eksportdan keyin JSON shu yerda chiqadi. Import uchun JSON ni shu yerga joylang."></textarea><p><button onclick="exp()">Eksport (nusxalash)</button><button onclick="imp($('#io').value)">Import</button></p><p><button onclick="dl()">Faylga saqlash</button><button onclick="this.nextElementSibling.click()">Fayldan yuklash</button><input type="file" accept=".json,application/json" style="display:none" onchange="impFile(this)"></p><small>Telefon ilovasida matn orqali (nusxalash/joylash) eng ishonchli usul.</small></div>
<button onclick="reset()">Progressni o'chirish</button>`}
function reset(){if(!rs){rs=true;toast('Tasdiqlash uchun yana bosing');return}S=fresh();fix();rebuild();applySet();save();rs=false;render()}
function setTh(m){S.set.theme=m;save();applySet();render()}
function setFs(d){S.set.font=Math.max(12,Math.min(26,S.set.font+d));save();applySet();render()}
function exp(){const j=JSON.stringify(S);$('#io').value=j;copy(j)}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kali_oquv_zaxira.json';a.click()}catch(e){toast("Faylga saqlab bo'lmadi, matndan foydalaning")}}
function imp(j){try{const o=JSON.parse(j);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;S=Object.assign(fresh(),o);fix();rebuild();applySet();save();toast('Yuklandi');render()}catch(e){toast("JSON noto'g'ri")}}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}
